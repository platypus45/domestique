name: Build release artifacts

# Builds a macOS DMG, a Windows EXE and a Linux AppImage on every tag push
# (v*.*.*) and uploads them to the matching GitHub Release. Runs also on
# manual dispatch. Binaries live in Release assets — never in git — so the
# repo stays lean.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v2.0.0). Leave blank to just build."
        required: false
        default: ""

permissions:
  contents: write  # needed to upload to releases

jobs:
  # ───────────────────────────────────────────────────────────────────
  # macOS DMG — DISABLED since v1.8.8
  #
  # CI builds the DMG without the Apple notarization secrets
  # (.notarize.env / Developer ID Application cert in keychain), so
  # build_dmg.sh falls back to ad-hoc signing. That produces a
  # Domestique.dmg that Gatekeeper rejects with "Domestique is damaged"
  # the moment a user downloads it. Worse, the bare-name Domestique.dmg
  # asset that CI uploaded sorted ahead of the manually-notarized
  # Domestique-v$VER.dmg in _select_platform_asset, so the update banner
  # served Mac users the broken one.
  #
  # macOS ships are produced manually via the [[domestique-release]] skill
  # (build_dmg.sh + .notarize.env + xcrun notarytool + stapler). Re-enable
  # this job only after the Apple secrets are wired into GitHub Actions
  # (APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD, APPLE_P12_BASE64) and
  # build_dmg.sh is taught to import the .p12 from base64 env in CI.
  # ───────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    if: false  # ← disabled; manual notarized ship via domestique-release skill
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg || echo "create-dmg already installed"

      # TODO: codesign + notarize. Requires Apple Developer ID secrets:
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
      # Without signing, end users must right-click → Open to bypass Gatekeeper.
      # Sketch for later:
      #   codesign --deep --options runtime --sign "$APPLE_DEV_ID" dist/Domestique.app
      #   xcrun notarytool submit dist_dmg/Domestique.dmg \
      #     --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
      #     --password "$APPLE_APP_PASSWORD" --wait
      #   xcrun stapler staple dist_dmg/Domestique.dmg

      - name: Build DMG
        run: |
          chmod +x packaging/build_dmg.sh
          # build_dmg.sh writes to ~/Desktop; we redirect via env var.
          export DESTDIR="$GITHUB_WORKSPACE/dist_dmg"
          mkdir -p "$DESTDIR"
          ./packaging/build_dmg.sh || { cat /tmp/dmg_build.log 2>/dev/null || true; exit 1; }
          # Fallback: some build_dmg.sh variants hardcode ~/Desktop
          if [ ! -f "$DESTDIR/Domestique.dmg" ] && [ -f "$HOME/Desktop/Domestique.dmg" ]; then
            cp "$HOME/Desktop/Domestique.dmg" "$DESTDIR/Domestique.dmg"
          fi
          ls -la "$DESTDIR"

      - name: Upload DMG artifact (build-only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Domestique-macOS-DMG
          path: dist_dmg/Domestique.dmg
          retention-days: 7

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_dmg/Domestique.dmg
          fail_on_unmatched_files: true

  # ───────────────────────────────────────────────────────────────────
  # Windows EXE
  # ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # v3.11.4: the intervals.icu TLS path must agree with Windows itself. A
      # rider's 3.11.3 log showed OpenSSL refusing the antivirus root Windows
      # trusts ("invalid CA certificate"). This installs an interceptor-style
      # root in the runner's ROOT store, reproduces that refusal with the
      # 3.11.3 context, then proves the OS-native verifier accepts it, still
      # rejects untrusted roots + hostname mismatches, and reaches the real
      # intervals.icu. Same Python + packages the EXE is frozen from.
      - name: "TLS probe: OS-native trust agrees with Windows"
        shell: pwsh
        run: |
          pip install cryptography
          python packaging/tls_intercept_probe_win.py

      # The OAuth client_secret lives in the gitignored .oauth.env (never in the
      # repo), so the CI checkout doesn't have it — without this the spec skips
      # bundling it and the Windows EXE ships an empty secret, making the
      # intervals.icu token exchange fail ("exchange" error). Write it from a
      # repo secret so the frozen build carries it. Fail loud if it's unset.
      - name: Write OAuth client secret (.oauth.env)
        shell: bash
        env:
          ICU_OAUTH_CLIENT_ID: ${{ secrets.ICU_OAUTH_CLIENT_ID }}
          ICU_OAUTH_CLIENT_SECRET: ${{ secrets.ICU_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "${ICU_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::ICU_OAUTH_CLIENT_SECRET repo secret is not set — OAuth would ship broken."; exit 1
          fi
          printf 'ICU_OAUTH_CLIENT_ID=%s\nICU_OAUTH_CLIENT_SECRET=%s\n' \
            "${ICU_OAUTH_CLIENT_ID:-511}" "${ICU_OAUTH_CLIENT_SECRET}" > .oauth.env
          echo "wrote .oauth.env ($(wc -c < .oauth.env) bytes)"

      # TODO: signtool codesign. Requires a Windows Authenticode certificate
      # (EV or OV). Without signing, SmartScreen shows the "Unknown publisher"
      # warning — end users must click "More info → Run anyway".
      #   signtool sign /tr http://timestamp.digicert.com /td sha256 \
      #     /fd sha256 /a dist\Domestique\Domestique.exe

      - name: Build EXE
        shell: cmd
        run: |
          call packaging\build_win.bat
          dir dist\Domestique

      # Watertight gate for the OAuth fix: prove the client_secret actually made
      # it into the frozen bundle (not just that we wrote .oauth.env pre-build).
      # A bundling regression fails CI here instead of shipping broken sign-in.
      - name: "Verify OAuth secret bundled into the EXE"
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path dist\Domestique -Recurse -Filter '.oauth.env' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Error "::error::.oauth.env not bundled in the EXE — OAuth sign-in would fail"; exit 1 }
          if ((Get-Content $f.FullName -Raw) -notmatch 'ICU_OAUTH_CLIENT_SECRET=\S') {
            Write-Error "::error::bundled .oauth.env has an empty ICU_OAUTH_CLIENT_SECRET"; exit 1
          }
          Write-Host "OK: .oauth.env bundled with a non-empty secret at $($f.FullName)"

      # Gate the build: a frozen EXE that won't start (or reports the wrong
      # version) must fail CI here rather than ship. Runs the EXE headless via
      # DOMESTIQUE_SERVER_ONLY=1 (no window/tray on the runner), polls the
      # server, and asserts the served version matches the repo VERSION file.
      - name: "Smoke-test: EXE starts + serves correct version"
        shell: pwsh
        run: |
          $env:DOMESTIQUE_SERVER_ONLY = "1"
          $expected = (Get-Content -Path VERSION -Raw).Trim()
          Write-Host "Expected version from VERSION file: $expected"

          $exePath = "dist\Domestique\Domestique.exe"

          # --- Pre-flight: prove the EXE exists and show the build layout. -----
          # A native PyInstaller crash exits pre-Python and writes nothing, so
          # we record the layout up front to spot a missing/short EXE or a
          # bootloader that failed to unpack its dependencies.
          Write-Host "===== PRE-FLIGHT ====="
          Write-Host "EXE present (Test-Path '$exePath'): $(Test-Path $exePath)"
          Write-Host "----- dist\Domestique\ (top level) -----"
          Get-ChildItem "dist\Domestique\" -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          # Anchor the Event Log query: we only want entries logged from now on.
          $startTime = Get-Date
          Write-Host "Smoke-test start time: $startTime"
          Write-Host "===== END PRE-FLIGHT ====="

          # Capture anything the EXE emits. The build is console=False so the
          # windowed process has no console of its own. Start-Process
          # -RedirectStandard* does NOT reliably capture a PyInstaller onedir
          # bootloader's child stdout/stderr (the files come back empty), so we
          # launch through cmd.exe and use OS-level redirection (> ... 2>&1),
          # which the bootloader's inherited handles DO get written to. The
          # merged stream lands in exe_out.txt. DOMESTIQUE_SERVER_ONLY is set
          # above and cmd inherits it.
          # NOTE: $proc is the cmd.exe wrapper, not the EXE itself — so
          # $proc.ExitCode is cmd's code, not the app's. We rely on the
          # /api/version poll + exe_out.txt contents for the verdict.
          $proc = Start-Process -FilePath "cmd.exe" `
            -ArgumentList '/c','"dist\Domestique\Domestique.exe" > exe_out.txt 2>&1' `
            -PassThru

          # Dump every diagnostic we can find into the CI log so a silent
          # startup failure becomes a readable traceback in the next run. Each
          # piece runs in its own try/catch so one failing collector never
          # suppresses the others.
          function Dump-Diagnostics {
            Write-Host "===== DIAGNOSTICS: EXE startup failure ====="

            # Process exit code — for a native (pre-Python) PyInstaller crash
            # this is the single most valuable signal: e.g. 0xC0000135 (DLL not
            # found), 0xC000007B (bad image / arch mismatch), 0xC0000409.
            try {
              if ($proc) {
                Write-Host "proc.HasExited: $($proc.HasExited)"
                if ($proc.HasExited) {
                  Write-Host ("proc.ExitCode: {0} (hex: 0x{1:X8})" -f $proc.ExitCode, $proc.ExitCode)
                } else {
                  Write-Host "proc.ExitCode: (still running)"
                }
              } else {
                Write-Host "proc: (null — never started)"
              }
            } catch { Write-Host "[exit-code collector failed] $($_.Exception.Message)" }

            # Merged stdout+stderr captured via cmd.exe OS-level redirection —
            # this is the reliable source for the Python-level traceback.
            try {
              Write-Host "=== EXE OUTPUT (exe_out.txt) ==="
              if (Test-Path exe_out.txt) { Get-Content exe_out.txt | Write-Host } else { Write-Host "(no exe_out.txt)" }
            } catch { Write-Host "[exe-output collector failed] $($_.Exception.Message)" }

            # WIN-DIAG: dead-simple crash dump written by start_server's except
            # clause (launcher.py) — depends on neither log_config nor stdout
            # capture, so it survives when both of those come back empty.
            try {
              $crash = Join-Path $env:USERPROFILE ".domestique\startup_crash.txt"
              Write-Host "=== startup_crash.txt ($crash) ==="
              if (Test-Path $crash) { Get-Content $crash | Write-Host } else { Write-Host "(no startup_crash.txt)" }
            } catch { Write-Host "[crash-dump collector failed] $($_.Exception.Message)" }

            # Legacy Start-Process redirect targets — usually empty for an
            # onedir bootloader, kept in case anything lands there.
            try {
              Write-Host "=== STDOUT ==="
              if (Test-Path "stdout.txt") { Get-Content "stdout.txt" } else { Write-Host "(no stdout.txt)" }
            } catch { Write-Host "[stdout collector failed] $($_.Exception.Message)" }
            try {
              Write-Host "=== STDERR ==="
              if (Test-Path "stderr.txt") { Get-Content "stderr.txt" } else { Write-Host "(no stderr.txt)" }
            } catch { Write-Host "[stderr collector failed] $($_.Exception.Message)" }

            # Launcher log(s): ~/.domestique/logs/domestique_<ts>.log — this is
            # where _log() mirrors the uvicorn/app-startup traceback.
            try {
              $logDir = Join-Path $env:USERPROFILE ".domestique\logs"
              if (Test-Path $logDir) {
                Write-Host "===== Launcher logs ($logDir) ====="
                Get-ChildItem $logDir -Recurse | ForEach-Object {
                  Write-Host "=== $($_.FullName) ==="
                  Get-Content $_.FullName
                }
              } else {
                Write-Host "(no launcher log dir at $logDir)"
              }
            } catch { Write-Host "[launcher-log collector failed] $($_.Exception.Message)" }

            # Any crash log the runtime may have left next to the EXE.
            try {
              Get-ChildItem -Path . -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "=== crash/runtime log: $($_.FullName) ==="
                Get-Content $_.FullName
              }
            } catch { Write-Host "[runtime-log collector failed] $($_.Exception.Message)" }

            # Windows Application Event Log — the key signal for a native crash
            # that left no file. Filter by start time, then surface Errors and
            # anything mentioning the app/runtime/fault.
            try {
              Write-Host "=== Windows Application Event Log (errors + relevant since start) ==="
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startTime} -ErrorAction SilentlyContinue |
                Where-Object { $_.LevelDisplayName -eq 'Error' -or $_.Message -match 'Domestique|\.NET|Faulting|clr|0xc0000' } |
                Select-Object -First 15 |
                Format-List TimeCreated, ProviderName, Id, Message | Out-String | Write-Host
            } catch { Write-Host "[event-log (by-message) collector failed] $($_.Exception.Message)" }

            try {
              Write-Host "=== Windows Application Event Log (by crash-reporting providers) ==="
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startTime} -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -match 'Application Error|.NET Runtime|Windows Error Reporting' } |
                Select-Object -First 15 |
                Format-List TimeCreated, ProviderName, Id, Message | Out-String | Write-Host
            } catch { Write-Host "[event-log (by-provider) collector failed] $($_.Exception.Message)" }

            Write-Host "===== END DIAGNOSTICS ====="
          }

          try {
            # Give the bootloader time to either crash natively or start serving.
            Start-Sleep -Seconds 12
            if ($proc.HasExited) {
              # $proc is the cmd.exe wrapper, so this exit code is cmd's, not the
              # app's — print it for what it's worth, but the real traceback is in
              # exe_out.txt (dumped by Dump-Diagnostics below).
              Write-Host ("cmd wrapper EXITED EARLY with code: {0} (hex: 0x{1:X8})" -f $proc.ExitCode, $proc.ExitCode)
              # Dump FIRST: GH Actions pwsh runs with $ErrorActionPreference=Stop,
              # so Write-Error is TERMINATING and would jump to finally{} before
              # the diagnostics ever print (this is why every prior dump was blank).
              Dump-Diagnostics
              Write-Host "::error::EXE exited before it could serve /api/version"
              exit 1
            }

            $served = $null
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:22400/api/version" -TimeoutSec 5
                $served = $resp.version
                Write-Host "Server responded; version=$served"
                break
              } catch {
                Write-Host "Waiting for server to come up... ($($_.Exception.Message))"
                Start-Sleep -Seconds 3
              }
            }
            if ($null -eq $served) {
              Dump-Diagnostics
              Write-Host "::error::EXE never served /api/version within 90s"
              exit 1
            }
            if ($served.Trim() -ne $expected) {
              Dump-Diagnostics
              Write-Host "::error::Version mismatch: served '$served' != VERSION '$expected'"
              exit 1
            }
            # Linux-IP D4 (all platforms): the bundled workout library must
            # survive packaging — a build that loses it boots fine and
            # silently degrades every plan to endurance-only.
            $hb = $null
            try {
              $hb = Invoke-RestMethod -Uri "http://127.0.0.1:22400/api/diag/health" -TimeoutSec 180
            } catch {
              Write-Host "diag/health request failed: $($_.Exception.Message)"
              try {
                $raw = Invoke-WebRequest -Uri "http://127.0.0.1:22400/api/diag/health" -TimeoutSec 30 -SkipHttpErrorCheck
                Write-Host "status=$($raw.StatusCode) body=$($raw.Content)"
              } catch { Write-Host "raw retry also failed: $($_.Exception.Message)" }
              Dump-Diagnostics
              Write-Host "::error::/api/diag/health unreachable — cannot verify the bundled library"
              exit 1
            }
            $libcount = [int]$hb.checks.workout_library.count
            if ($libcount -lt 4000) {
              Dump-Diagnostics
              Write-Host "::error::bundled workout library count=$libcount (<4000) — packaging lost the library"
              exit 1
            }
            $hitn = [int]$hb.checks.pool_health.hit
            if ($hitn -lt 1000) {
              Dump-Diagnostics
              Write-Host "::error::hit pool count=$hitn (<1000) — classification/facts fault inside the bundle"
              exit 1
            }
            # v3.11.3: the OAuth secret must be LOADED by the frozen app, not just
            # bundled — a rider reported "token exchange failed" on 3.11.2.
            if (-not $hb.checks.icu_oauth.secret_loaded) {
              Dump-Diagnostics
              Write-Host "::error::frozen app did not load the OAuth client secret — sign-in would fail"
              exit 1
            }
            # v3.11.4: the frozen EXE must verify intervals.icu with the OS
            # verifier — the 3.11.3 rider's antivirus root is refused by OpenSSL.
            $tlsb = "$($hb.checks.icu_oauth.tls_backend)"
            if ($tlsb -ne "os-native") {
              Dump-Diagnostics
              Write-Host "::error::frozen app verifies TLS with '$tlsb' (expected os-native) — truststore not bundled/selected"
              exit 1
            }
            Write-Host "Smoke-test passed: EXE serves version $served, library=$libcount, hit=$hitn, oauth_secret=loaded, tls=$tlsb"
          } finally {
            # $proc is the cmd.exe wrapper; the EXE is its child. Kill the whole
            # tree (/T) so Domestique.exe doesn't outlive the wrapper.
            if ($proc -and -not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F 2>$null
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package EXE as zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Domestique\* -DestinationPath Domestique-Windows.zip

      - name: Upload EXE artifact (build-only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Domestique-Windows-EXE
          path: Domestique-Windows.zip
          retention-days: 7

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Domestique-Windows.zip
          fail_on_unmatched_files: true

  # ───────────────────────────────────────────────────────────────────
  # Linux AppImage — ADDITIVE AND NON-BLOCKING
  #
  # Nothing here may cost the macOS or Windows ship. No `needs:` couples this
  # job to build-macos/build-windows in either direction, and
  # continue-on-error keeps a red Linux build from failing the workflow run —
  # a broken AppImage must still leave a complete macOS+Windows release. The
  # price is that failures show as a warning rather than a red X, so every
  # gate below emits a ::error:: annotation that survives into the summary.
  #
  # runs-on is the moving `ubuntu-latest` label, but the build happens inside
  # an ubuntu:22.04 *container*: the label may roll freely while the container
  # is what the binary links against (glibc floor 2.35). Pinning the
  # `ubuntu-22.04` runner label instead starts brownout-failing 2026-09-17,
  # and building on 24.04 would raise the floor to glibc 2.39 and lock out
  # 22.04 users. A container image is neither.
  # ───────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    continue-on-error: true
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      # A container job starts from the bare image: none of the runner image's
      # toolchain exists — no git, no curl, no ca-certificates, no sudo — so
      # this has to come before actions/checkout, which would otherwise fall
      # back to the REST tarball and leave no .git behind.
      - name: Install toolchain (the bare container has none)
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git file xz-utils zsync jq \
            build-essential pkg-config \
            software-properties-common gnupg python3-launchpadlib \
            desktop-file-utils libfuse2 \
            iproute2 procps psmisc \
            xvfb x11-utils xdotool imagemagick openbox \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb-cursor0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libglib2.0-0 libxkbfile1 psmisc \
            libgl1 libegl1 libopengl0 libgbm1 libdrm2 libxshmfence1 \
            libglib2.0-0 libdbus-1-3 libnss3 libnspr4 libasound2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 \
            libxfixes3 libxrender1 libxext6 libfontconfig1 libfreetype6 \
            fonts-dejavu-core
          # 3.12 is not in the jammy archive; deadsnakes carries it, and the
          # PPA route needs launchpadlib, which --no-install-recommends drops.
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3.12 python3.12-venv python3.12-dev libpython3.12

      # build_linux.sh calls `pip3` and `python3`; both must be 3.12, and
      # deadsnakes ships neither pip nor a `python3` alias. A PATH shim rather
      # than update-alternatives: rewiring /usr/bin/python3 on Ubuntu breaks
      # apt's own tooling, which is bound to 3.10.
      # PyInstaller needs libpython3.X.so.1.0 to freeze a binary; without it the
      # build dies with "Python shared library was not found". The -dev package
      # does not reliably carry it on deadsnakes.
      - name: Put python3.12 (and its pip) first on PATH
        run: |
          set -eux
          python3.12 -m ensurepip --upgrade
          mkdir -p /opt/py312
          ln -sf /usr/bin/python3.12 /opt/py312/python3
          ln -sf /usr/bin/python3.12 /opt/py312/python
          for p in pip pip3; do
            printf '#!/bin/sh\nexec /usr/bin/python3.12 -m pip "$@"\n' > "/opt/py312/$p"
            chmod +x "/opt/py312/$p"
          done
          echo /opt/py312 >> "$GITHUB_PATH"

      # build_linux.sh requires appimagetool on PATH and refuses to start
      # without it. There is no apt package; the tool is itself an AppImage.
      - name: Install appimagetool
        run: |
          set -eux
          # AppImageKit is deprecated and its release-13 assets were RENAMED to
          # obsolete-* upstream, so the old pinned URL now 404s. The maintained
          # tool lives in AppImage/appimagetool under the rolling `continuous`
          # tag — there is no versioned release to pin to.
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # appimagetool is itself an AppImage and mounts via FUSE, which a
          # container does not have. This is the supported way to run one
          # without it; without this the next step dies on "fuse: device not
          # found" rather than anything to do with our build.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - uses: actions/checkout@v4

      # The checkout is owned by a different uid than the container's root in
      # some runner configurations; git refuses to read it without this.
      - name: Trust the checkout
        run: git config --global --add safe.directory '*'

      # Same reasoning as the Windows job: the OAuth client_secret lives in the
      # gitignored .oauth.env, so a CI checkout doesn't have it and the build
      # would ship an empty secret with a broken intervals.icu token exchange.
      - name: Write OAuth client secret (.oauth.env)
        env:
          ICU_OAUTH_CLIENT_ID: ${{ secrets.ICU_OAUTH_CLIENT_ID }}
          ICU_OAUTH_CLIENT_SECRET: ${{ secrets.ICU_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "${ICU_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::ICU_OAUTH_CLIENT_SECRET repo secret is not set — OAuth would ship broken."; exit 1
          fi
          printf 'ICU_OAUTH_CLIENT_ID=%s\nICU_OAUTH_CLIENT_SECRET=%s\n' \
            "${ICU_OAUTH_CLIENT_ID:-511}" "${ICU_OAUTH_CLIENT_SECRET}" > .oauth.env
          echo "wrote .oauth.env ($(wc -c < .oauth.env) bytes)"

      - name: Build AppImage
        env:
          # appimagetool is itself an AppImage and a GitHub job container has
          # no /dev/fuse, so it has to unpack itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # build_linux.sh pip-installs into the container's system python on
          # purpose (it is a throwaway container, not a developer machine);
          # PEP 668 would otherwise refuse, and the flag is not ours to add to
          # build_linux.sh's pip line.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -eux
          chmod +x packaging/build_linux.sh
          ./packaging/build_linux.sh

      - name: Locate the AppImage
        run: |
          set -eu
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # Frozen literal. The version token is deliberate: the bare-name
          # Domestique.dmg once out-sorted the good asset in the update picker.
          NAME="Domestique-v${VERSION}-x86_64.AppImage"
          FOUND="$(find . -maxdepth 3 -type f -name "$NAME" -print -quit)"
          if [ -z "$FOUND" ]; then
            echo "::error::build_linux.sh produced no $NAME"
            find . -maxdepth 3 -name '*.AppImage' -print || true
            exit 1
          fi
          mkdir -p dist_linux
          cp "$FOUND" dist_linux/
          chmod +x "dist_linux/$NAME"
          # The host-dependency lists are derived mechanically by build_linux.sh
          # (ldd over the AppDir after the graphics stack is stripped): sonames
          # in host-deps.txt, Debian package names in host-deps-debian.txt. The
          # clean-container job installs exactly the latter and nothing else —
          # a list retyped into CI would drift from the artifact in silence.
          if [ -f dist/host-deps-debian.txt ]; then
            cp dist/host-deps.txt dist/host-deps-debian.txt dist_linux/
          else
            echo "::warning::build_linux.sh emitted no dist/host-deps-debian.txt — the clean-container check cannot run"
          fi
          echo "APPIMAGE=dist_linux/$NAME" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la dist_linux

      # Gate the build the way the Windows job does, plus the assertion that is
      # the entire point of this release: a real, mapped, native window. Two
      # stages share one port, so stage A is killed and :22400 drained before
      # the app starts — otherwise _ensure_port_free_or_die kills it.
      - name: "Smoke-test: AppImage serves the right version and opens a real window"
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Only what CI genuinely lacks and a real desktop genuinely has.
          # Deliberately NOT QTWEBENGINE_DISABLE_SANDBOX and NOT
          # QT_QPA_PLATFORM: the shipped AppRun owns every Qt variable, and
          # this test exists to prove the *shipped* values work. Setting them
          # here would certify a configuration no user ever runs.
          DISPLAY: ":99"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -u

          dump_diagnostics() {
            echo "===== DIAGNOSTICS ====="
            for f in headless.log gui.log xvfb.log openbox.log wininfo.txt; do
              echo "--- $f ---"; cat "$f" 2>/dev/null || echo "(none)"
            done
            echo "--- startup_crash.txt ---"
            cat "$HOME/.domestique/startup_crash.txt" 2>/dev/null || echo "(none)"
            echo "--- launcher logs ---"
            for f in "$HOME"/.domestique/logs/*.log; do
              [ -f "$f" ] || continue
              echo "=== $f ==="; cat "$f"
            done
            echo "--- listeners ---"; ss -ltnp 2>/dev/null || true
            echo "--- processes ---"; ps -ef || true
            echo "===== END DIAGNOSTICS ====="
          }
          fail() { echo "::error::$1"; dump_diagnostics; exit 1; }

          echo "Expected version from VERSION file: $EXPECTED_VERSION"

          # A headless stage used to run first and assert the served version,
          # then hand the port to the GUI stage. It cost three runs to port
          # collisions — the AppImage wrapper exec's an extracted binary, so
          # killing the pid we launched leaves the real listener alive — and it
          # proved nothing the GUI stage does not. The GUI stage asserts the
          # same version over the same port, and additionally that a window
          # opened. One instance, no teardown, no race.

          echo "===== native window ====="
          Xvfb :99 -screen 0 1600x1000x24 -ac +extension GLX +render -noreset > xvfb.log 2>&1 &
          XVFB_PID=$!
          for _ in $(seq 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 >/dev/null 2>&1 || fail "Xvfb never came up on :99"
          openbox > openbox.log 2>&1 &
          sleep 2

          "./$APPIMAGE" > gui.log 2>&1 &
          B_PID=$!
          sleep 25

          # 1. still alive. An exited-but-unreaped child answers kill -0, so
          #    the zombie state has to be checked separately.
          kill -0 "$B_PID" 2>/dev/null || fail "AppImage exited within 25s of GUI launch"
          case "$(ps -o stat= -p "$B_PID" 2>/dev/null)" in
            Z*) fail "AppImage process died within 25s of GUI launch (zombie)" ;;
          esac

          # 2. a MAPPED window. This is the assertion the release is about: a
          #    browser tab would satisfy every HTTP check below it.
          WID=""
          for _ in $(seq 20); do
            WID="$(xdotool search --onlyvisible --name 'Domestique' 2>/dev/null | head -1)"
            [ -n "$WID" ] && break
            sleep 3
          done
          [ -n "$WID" ] || fail "no mapped window named 'Domestique' — the native window did not open"
          xwininfo -id "$WID" > wininfo.txt 2>&1 || fail "xwininfo could not read window $WID"
          cat wininfo.txt
          grep -q 'Map State: IsViewable' wininfo.txt || fail "window $WID exists but is not viewable"

          # 3. localhost verbatim — the window loads http://127.0.0.1:22400, so
          #    an assertion that only ever hits 127.0.0.1 would sail past a
          #    hostname-resolution break the user would hit immediately.
          body="$(curl -fsS --max-time 5 http://localhost:22400/api/version)" \
            || fail "the GUI instance did not answer on http://localhost:22400"
          served="$(printf '%s' "$body" | jq -r .version)"
          [ "$served" = "$EXPECTED_VERSION" ] || fail "GUI served '$served' != VERSION '$EXPECTED_VERSION'"

          # Linux-IP D4: the bundled workout library must survive packaging.
          # A build that loses it (or its classification/facts sidecars)
          # still boots, still serves the version, and silently degrades
          # every plan to endurance-only — the v3.11.0 Linux report class.
          hb="$(curl -fsS --max-time 10 http://localhost:22400/api/diag/health)" \
            || fail "/api/diag/health did not answer"
          libcount="$(printf '%s' "$hb" | jq -r '.checks.workout_library.count // 0')"
          [ "$libcount" -ge 4000 ] || fail "bundled workout library count=$libcount (<4000) — packaging lost the library"
          hitn="$(printf '%s' "$hb" | jq -r '.checks.pool_health.hit // 0')"
          [ "$hitn" -ge 1000 ] || fail "hit pool count=$hitn (<1000) — classification/facts fault inside the bundle"
          creason="$(printf '%s' "$hb" | jq -r '.checks.pool_health.collapse_reason // empty')"
          [ -z "$creason" ] || fail "pool collapse inside built artifact: $creason"
          # v3.11.3: OAuth secret LOADED by the frozen app (not merely bundled).
          secret_loaded="$(printf '%s' "$hb" | jq -r '.checks.icu_oauth.secret_loaded // false')"
          [ "$secret_loaded" = "true" ] || fail "frozen app did not load the OAuth client secret — sign-in would fail"
          # v3.11.4: Linux stays on OpenSSL + certifi + OS store (os-native is Windows-only).
          tls_backend="$(printf '%s' "$hb" | jq -r '.checks.icu_oauth.tls_backend // empty')"
          [ "$tls_backend" = "openssl" ] || fail "Linux TLS backend is '$tls_backend' (expected openssl)"

          #    ...and the listener must BE the GUI process, not a stage-A leftover.
          PORT_PID="$(ss -ltnp 2>/dev/null | awk '/:22400 /{ if (match($0, /pid=[0-9]+/)) print substr($0, RSTART+4, RLENGTH-4) }' | head -1)"
          [ -n "$PORT_PID" ] || fail "nothing is listening on :22400"
          p="$PORT_PID"; owner=""
          while [ -n "$p" ] && [ "$p" != "1" ] && [ "$p" != "0" ]; do
            if [ "$p" = "$B_PID" ]; then owner="yes"; break; fi
            p="$(ps -o ppid= -p "$p" 2>/dev/null | tr -d ' ')"
          done
          [ -n "$owner" ] || fail ":22400 is held by PID $PORT_PID, which is not the GUI process ($B_PID) nor a descendant"

          # 4. the browser fallback is a spec violation on Linux, and its worst
          #    shape is a live process holding :22400 with no window — which
          #    every check above would still pass if the server came up.
          if grep -REn '_fallback_to_browser|opening in browser' \
          # The grep above is a belt: on Linux the fatal path diverts before
          # either string is emitted, so it can never fire. The braces are
          # the crash file the fatal path DOES write, and the exit code.
          if [ -f "$HOME/.domestique/startup_crash.txt" ]; then
            echo "FAIL: startup_crash.txt written — the GUI backend died"; cat "$HOME/.domestique/startup_crash.txt"; exit 1
          fi
               gui.log "$HOME/.domestique/logs" 2>/dev/null; then
            fail "the AppImage fell back to a browser — a native window is a hard requirement"
          fi

          # 5. something was actually drawn. A mapped window can still be a
          #    blank rectangle if the web engine failed to paint.
          import -window root screenshot.png || fail "could not capture the root window"
          SD="$(identify -format '%[fx:standard_deviation]' screenshot.png)"
          echo "screenshot standard deviation: $SD"
          awk -v sd="$SD" 'BEGIN { exit !(sd > 0.01) }' \
            || fail "screenshot is blank (standard deviation $SD) — nothing was drawn"

          echo "Smoke-test passed: version $served, mapped window $WID, screenshot sd=$SD"
          kill "$B_PID" 2>/dev/null || true
          pkill -9 -f 'Domestique' 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      # CI cannot prove the window RENDERS correctly — a human still has to
      # look. This is the picture they look at.
      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Domestique-Linux-smoke-screenshot
          path: screenshot.png
          retention-days: 7
          if-no-files-found: warn

      # Uploaded on every trigger (not just workflow_dispatch, unlike the
      # Windows zip) because verify-linux-clean-container consumes it.
      - name: Upload AppImage artifact
        if: env.APPIMAGE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Domestique-Linux-AppImage
          path: dist_linux/
          retention-days: 7

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v') && env.APPIMAGE != ''
        # Belt and braces on top of the job-level flag: a flaky asset upload
        # must not be able to take the macOS/Windows release down with it.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMAGE }}
          fail_on_unmatched_files: true

  # ───────────────────────────────────────────────────────────────────
  # Linux clean-room check — also non-blocking, also uncoupled from mac/win.
  #
  # The build container has a full desktop toolchain installed, so it cannot
  # prove the claim the release actually makes: download and run on a stock
  # distro. This runs the built AppImage in a bare debian:12-slim carrying
  # ONLY the mechanically-derived host dependencies. It needs a plain runner
  # rather than a `container:` job because it drives the docker CLI, which a
  # job container has no socket for.
  # ───────────────────────────────────────────────────────────────────
  verify-linux-clean-container:
    name: Verify Linux AppImage on a clean distro
    needs: build-linux
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Domestique-Linux-AppImage
          path: appimage

      - name: Run the AppImage on a stock debian:12-slim
        run: |
          set -eu
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ ! -f appimage/host-deps-debian.txt ]; then
            echo "::error::no host-deps-debian.txt in the artifact — cannot prove the declared host deps are sufficient"
            exit 1
          fi
          echo "Declared host dependencies (packages):"; cat appimage/host-deps-debian.txt
          echo "Declared host dependencies (sonames):";  cat appimage/host-deps.txt
          chmod +x "appimage/Domestique-v${VERSION}-x86_64.AppImage"
          # --shm-size=1g because a real desktop has a real /dev/shm and
          # Chromium needs one. Docker's 64 MB default would only be papered
          # over with --disable-dev-shm-usage, which no user runs.
          # APPIMAGE_EXTRACT_AND_RUN because CI has no /dev/fuse; the shipped
          # AppRun and the shipped payload still run, which is what this
          # proves.
          docker run --rm --shm-size=1g \
            -v "$PWD/appimage:/ai:ro" \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e DEBIAN_FRONTEND=noninteractive \
            -e "EXPECTED=$VERSION" \
            debian:12-slim bash -euc '
              apt-get update -qq
              # Test tooling first, then the declared host deps and nothing else.
              apt-get install -y --no-install-recommends curl procps > /dev/null
              # One at a time: the package NAMES were derived on jammy and a
              # handful differ on bookworm, which would abort a single batch
              # install and hide the real answer. The ldd sweep below is the
              # verdict — an unresolvable name only matters if a library it
              # would have supplied is actually missing.
              while IFS= read -r pkg; do
                [ -n "$pkg" ] || continue
                apt-get install -y --no-install-recommends "$pkg" < /dev/null > /dev/null 2>&1 \
                  || echo "::warning::debian:12 has no package named $pkg (jammy-derived name)"
              done < /ai/host-deps-debian.txt

              cp /ai/Domestique-*.AppImage /tmp/app.AppImage
              chmod +x /tmp/app.AppImage
              cd /tmp && ./app.AppImage --appimage-extract > /dev/null

              echo "===== the payload resolves against the declared deps alone ====="
              # ldd must be handed the SAME library search path the app runs
              # with, or it judges the payload against a loader environment that
              # never exists. PyInstaller collects system libraries into
              # _internal/ and nothing in the tree has an RPATH pointing there;
              # the bootloader exports LD_LIBRARY_PATH=<payload>/_internal at
              # startup instead (visible in /proc/<pid>/environ of the running
              # app). A bare ldd skipped every bundled copy and re-resolved
              # against the host, which is how the bundled jammy libnss3.so
              # (NSS >= 3.94) got paired with bookworms libnssutil3.so (3.87)
              # and reported a phantom NSSUTIL_3.94 failure for a pairing the
              # loader never makes.
              #
              # Deliberately NOT a name-match exemption. Asking "does a file by
              # this name exist under the payload?" excuses two things it must
              # not: a copy buried somewhere the loader never searches, and a
              # DANGLING SYMLINK. Both were live here -- _internal is full of
              # symlinks into PySide6/Qt/lib, and pruning a Qt library leaves
              # the link behind, so a name match happily excused a
              # libQt6Multimedia.so.6 that resolves to nothing. Letting the
              # real loader answer gets both right for free.
              #
              # env, not export: scoping it to the sweep keeps the later
              # AppImage launch exercising the shipped AppRun, which is the
              # only thing proving the artifact self-configures.
              INTERNAL="$(find squashfs-root -type d -name _internal -print -quit)"
              [ -n "$INTERNAL" ] || { echo "::error::no _internal/ directory in the extracted payload — the bundle layout changed and this sweep is looking at the wrong tree"; exit 1; }
              missing="$(find squashfs-root -type f \( -name "*.so*" -o -perm -u+x \) \
                -exec env LD_LIBRARY_PATH="$PWD/$INTERNAL" ldd {} + 2>/dev/null \
                | grep "not found" | sort -u || true)"
              if [ -n "$missing" ]; then
                echo "::error::unresolved libraries under the declared host deps — this is the crash a user gets on a stock distro"
                echo "$missing"
                exit 1
              fi
              echo "OK: no unresolved libraries"

              # Same gate the Windows job runs: prove the OAuth secret survived
              # into the bundle rather than shipping broken sign-in.
              oauth="$(find squashfs-root -name .oauth.env -print -quit)"
              [ -n "$oauth" ] || { echo "::error::.oauth.env not bundled in the AppImage — OAuth sign-in would fail"; exit 1; }
              grep -q "ICU_OAUTH_CLIENT_SECRET=." "$oauth" \
                || { echo "::error::bundled .oauth.env has an empty ICU_OAUTH_CLIENT_SECRET"; exit 1; }
              echo "OK: .oauth.env bundled with a non-empty secret"

              # Xvfb goes in only AFTER the ldd sweep — it drags in half the X
              # stack and would mask a host dep the AppImage failed to declare.
              # It stands in for the user'"'"'s X server, not for an app dependency.
              apt-get install -y --no-install-recommends xvfb > /dev/null
              Xvfb :99 -screen 0 1600x1000x24 -ac -noreset > /tmp/xvfb.log 2>&1 &
              sleep 3
              export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1

              /tmp/app.AppImage > /tmp/run.log 2>&1 &
              pid=$!
              served=""
              for _ in $(seq 30); do
                served="$(curl -fsS --max-time 5 http://localhost:22400/api/version 2>/dev/null || true)"
                [ -n "$served" ] && break
                sleep 3
              done
              if [ -z "$served" ]; then
                echo "::error::AppImage never served /api/version on a stock debian:12-slim"
                cat /tmp/run.log; cat ~/.domestique/startup_crash.txt 2>/dev/null || true
                exit 1
              fi
              kill -0 "$pid" 2>/dev/null || { echo "::error::AppImage exited on a stock debian:12-slim"; cat /tmp/run.log; exit 1; }
              compact="$(printf "%s" "$served" | tr -d " \n")"
              case "$compact" in
                *"\"version\":\"$EXPECTED\""*) echo "OK: served version $EXPECTED" ;;
                *) echo "::error::version mismatch on the clean container: $served"; exit 1 ;;
              esac
              if grep -REn "_fallback_to_browser|opening in browser" /tmp/run.log ~/.domestique/logs 2>/dev/null; then
              # The grep above is a belt: on Linux the fatal path diverts before
              # either string is emitted, so it can never fire. The braces are
              # the crash file the fatal path DOES write, and the exit code.
              if [ -f "$HOME/.domestique/startup_crash.txt" ]; then
                echo "FAIL: startup_crash.txt written — the GUI backend died"; cat "$HOME/.domestique/startup_crash.txt"; exit 1
              fi
                echo "::error::the AppImage fell back to a browser on a stock distro"
                exit 1
              fi
              echo "Clean-container check passed."
            '
