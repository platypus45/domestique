name: Build release artifacts

# Builds a macOS DMG and a Windows EXE on every tag push (v*.*.*) and
# uploads both to the matching GitHub Release. Runs also on manual dispatch.
# Binaries live in Release assets — never in git — so the repo stays lean.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v2.0.0). Leave blank to just build."
        required: false
        default: ""

permissions:
  contents: write  # needed to upload to releases

jobs:
  # ───────────────────────────────────────────────────────────────────
  # macOS DMG — DISABLED since v1.8.8
  #
  # CI builds the DMG without the Apple notarization secrets
  # (.notarize.env / Developer ID Application cert in keychain), so
  # build_dmg.sh falls back to ad-hoc signing. That produces a
  # Domestique.dmg that Gatekeeper rejects with "Domestique is damaged"
  # the moment a user downloads it. Worse, the bare-name Domestique.dmg
  # asset that CI uploaded sorted ahead of the manually-notarized
  # Domestique-v$VER.dmg in _select_platform_asset, so the update banner
  # served Mac users the broken one.
  #
  # macOS ships are produced manually via the [[domestique-release]] skill
  # (build_dmg.sh + .notarize.env + xcrun notarytool + stapler). Re-enable
  # this job only after the Apple secrets are wired into GitHub Actions
  # (APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD, APPLE_P12_BASE64) and
  # build_dmg.sh is taught to import the .p12 from base64 env in CI.
  # ───────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    if: false  # ← disabled; manual notarized ship via domestique-release skill
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg || echo "create-dmg already installed"

      # TODO: codesign + notarize. Requires Apple Developer ID secrets:
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
      # Without signing, end users must right-click → Open to bypass Gatekeeper.
      # Sketch for later:
      #   codesign --deep --options runtime --sign "$APPLE_DEV_ID" dist/Domestique.app
      #   xcrun notarytool submit dist_dmg/Domestique.dmg \
      #     --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
      #     --password "$APPLE_APP_PASSWORD" --wait
      #   xcrun stapler staple dist_dmg/Domestique.dmg

      - name: Build DMG
        run: |
          chmod +x build_dmg.sh
          # build_dmg.sh writes to ~/Desktop; we redirect via env var.
          export DESTDIR="$GITHUB_WORKSPACE/dist_dmg"
          mkdir -p "$DESTDIR"
          ./build_dmg.sh || { cat /tmp/dmg_build.log 2>/dev/null || true; exit 1; }
          # Fallback: some build_dmg.sh variants hardcode ~/Desktop
          if [ ! -f "$DESTDIR/Domestique.dmg" ] && [ -f "$HOME/Desktop/Domestique.dmg" ]; then
            cp "$HOME/Desktop/Domestique.dmg" "$DESTDIR/Domestique.dmg"
          fi
          ls -la "$DESTDIR"

      - name: Upload DMG artifact (build-only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Domestique-macOS-DMG
          path: dist_dmg/Domestique.dmg
          retention-days: 7

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_dmg/Domestique.dmg
          fail_on_unmatched_files: true

  # ───────────────────────────────────────────────────────────────────
  # Windows EXE
  # ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # TODO: signtool codesign. Requires a Windows Authenticode certificate
      # (EV or OV). Without signing, SmartScreen shows the "Unknown publisher"
      # warning — end users must click "More info → Run anyway".
      #   signtool sign /tr http://timestamp.digicert.com /td sha256 \
      #     /fd sha256 /a dist\Domestique\Domestique.exe

      - name: Build EXE
        shell: cmd
        run: |
          call build_win.bat
          dir dist\Domestique

      # Gate the build: a frozen EXE that won't start (or reports the wrong
      # version) must fail CI here rather than ship. Runs the EXE headless via
      # DOMESTIQUE_SERVER_ONLY=1 (no window/tray on the runner), polls the
      # server, and asserts the served version matches the repo VERSION file.
      - name: "Smoke-test: EXE starts + serves correct version"
        shell: pwsh
        run: |
          $env:DOMESTIQUE_SERVER_ONLY = "1"
          $expected = (Get-Content -Path VERSION -Raw).Trim()
          Write-Host "Expected version from VERSION file: $expected"

          $exePath = "dist\Domestique\Domestique.exe"

          # --- Pre-flight: prove the EXE exists and show the build layout. -----
          # A native PyInstaller crash exits pre-Python and writes nothing, so
          # we record the layout up front to spot a missing/short EXE or a
          # bootloader that failed to unpack its dependencies.
          Write-Host "===== PRE-FLIGHT ====="
          Write-Host "EXE present (Test-Path '$exePath'): $(Test-Path $exePath)"
          Write-Host "----- dist\Domestique\ (top level) -----"
          Get-ChildItem "dist\Domestique\" -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          # Anchor the Event Log query: we only want entries logged from now on.
          $startTime = Get-Date
          Write-Host "Smoke-test start time: $startTime"
          Write-Host "===== END PRE-FLIGHT ====="

          # Capture anything the EXE emits. The build is console=False so the
          # windowed process has no console of its own. Start-Process
          # -RedirectStandard* does NOT reliably capture a PyInstaller onedir
          # bootloader's child stdout/stderr (the files come back empty), so we
          # launch through cmd.exe and use OS-level redirection (> ... 2>&1),
          # which the bootloader's inherited handles DO get written to. The
          # merged stream lands in exe_out.txt. DOMESTIQUE_SERVER_ONLY is set
          # above and cmd inherits it.
          # NOTE: $proc is the cmd.exe wrapper, not the EXE itself — so
          # $proc.ExitCode is cmd's code, not the app's. We rely on the
          # /api/version poll + exe_out.txt contents for the verdict.
          $proc = Start-Process -FilePath "cmd.exe" `
            -ArgumentList '/c','"dist\Domestique\Domestique.exe" > exe_out.txt 2>&1' `
            -PassThru

          # Dump every diagnostic we can find into the CI log so a silent
          # startup failure becomes a readable traceback in the next run. Each
          # piece runs in its own try/catch so one failing collector never
          # suppresses the others.
          function Dump-Diagnostics {
            Write-Host "===== DIAGNOSTICS: EXE startup failure ====="

            # Process exit code — for a native (pre-Python) PyInstaller crash
            # this is the single most valuable signal: e.g. 0xC0000135 (DLL not
            # found), 0xC000007B (bad image / arch mismatch), 0xC0000409.
            try {
              if ($proc) {
                Write-Host "proc.HasExited: $($proc.HasExited)"
                if ($proc.HasExited) {
                  Write-Host ("proc.ExitCode: {0} (hex: 0x{1:X8})" -f $proc.ExitCode, $proc.ExitCode)
                } else {
                  Write-Host "proc.ExitCode: (still running)"
                }
              } else {
                Write-Host "proc: (null — never started)"
              }
            } catch { Write-Host "[exit-code collector failed] $($_.Exception.Message)" }

            # Merged stdout+stderr captured via cmd.exe OS-level redirection —
            # this is the reliable source for the Python-level traceback.
            try {
              Write-Host "=== EXE OUTPUT (exe_out.txt) ==="
              if (Test-Path exe_out.txt) { Get-Content exe_out.txt | Write-Host } else { Write-Host "(no exe_out.txt)" }
            } catch { Write-Host "[exe-output collector failed] $($_.Exception.Message)" }

            # WIN-DIAG: dead-simple crash dump written by start_server's except
            # clause (launcher.py) — depends on neither log_config nor stdout
            # capture, so it survives when both of those come back empty.
            try {
              $crash = Join-Path $env:USERPROFILE ".domestique\startup_crash.txt"
              Write-Host "=== startup_crash.txt ($crash) ==="
              if (Test-Path $crash) { Get-Content $crash | Write-Host } else { Write-Host "(no startup_crash.txt)" }
            } catch { Write-Host "[crash-dump collector failed] $($_.Exception.Message)" }

            # Legacy Start-Process redirect targets — usually empty for an
            # onedir bootloader, kept in case anything lands there.
            try {
              Write-Host "=== STDOUT ==="
              if (Test-Path "stdout.txt") { Get-Content "stdout.txt" } else { Write-Host "(no stdout.txt)" }
            } catch { Write-Host "[stdout collector failed] $($_.Exception.Message)" }
            try {
              Write-Host "=== STDERR ==="
              if (Test-Path "stderr.txt") { Get-Content "stderr.txt" } else { Write-Host "(no stderr.txt)" }
            } catch { Write-Host "[stderr collector failed] $($_.Exception.Message)" }

            # Launcher log(s): ~/.domestique/logs/domestique_<ts>.log — this is
            # where _log() mirrors the uvicorn/app-startup traceback.
            try {
              $logDir = Join-Path $env:USERPROFILE ".domestique\logs"
              if (Test-Path $logDir) {
                Write-Host "===== Launcher logs ($logDir) ====="
                Get-ChildItem $logDir -Recurse | ForEach-Object {
                  Write-Host "=== $($_.FullName) ==="
                  Get-Content $_.FullName
                }
              } else {
                Write-Host "(no launcher log dir at $logDir)"
              }
            } catch { Write-Host "[launcher-log collector failed] $($_.Exception.Message)" }

            # Any crash log the runtime may have left next to the EXE.
            try {
              Get-ChildItem -Path . -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "=== crash/runtime log: $($_.FullName) ==="
                Get-Content $_.FullName
              }
            } catch { Write-Host "[runtime-log collector failed] $($_.Exception.Message)" }

            # Windows Application Event Log — the key signal for a native crash
            # that left no file. Filter by start time, then surface Errors and
            # anything mentioning the app/runtime/fault.
            try {
              Write-Host "=== Windows Application Event Log (errors + relevant since start) ==="
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startTime} -ErrorAction SilentlyContinue |
                Where-Object { $_.LevelDisplayName -eq 'Error' -or $_.Message -match 'Domestique|\.NET|Faulting|clr|0xc0000' } |
                Select-Object -First 15 |
                Format-List TimeCreated, ProviderName, Id, Message | Out-String | Write-Host
            } catch { Write-Host "[event-log (by-message) collector failed] $($_.Exception.Message)" }

            try {
              Write-Host "=== Windows Application Event Log (by crash-reporting providers) ==="
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startTime} -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -match 'Application Error|.NET Runtime|Windows Error Reporting' } |
                Select-Object -First 15 |
                Format-List TimeCreated, ProviderName, Id, Message | Out-String | Write-Host
            } catch { Write-Host "[event-log (by-provider) collector failed] $($_.Exception.Message)" }

            Write-Host "===== END DIAGNOSTICS ====="
          }

          try {
            # Give the bootloader time to either crash natively or start serving.
            Start-Sleep -Seconds 12
            if ($proc.HasExited) {
              # $proc is the cmd.exe wrapper, so this exit code is cmd's, not the
              # app's — print it for what it's worth, but the real traceback is in
              # exe_out.txt (dumped by Dump-Diagnostics below).
              Write-Host ("cmd wrapper EXITED EARLY with code: {0} (hex: 0x{1:X8})" -f $proc.ExitCode, $proc.ExitCode)
              # Dump FIRST: GH Actions pwsh runs with $ErrorActionPreference=Stop,
              # so Write-Error is TERMINATING and would jump to finally{} before
              # the diagnostics ever print (this is why every prior dump was blank).
              Dump-Diagnostics
              Write-Host "::error::EXE exited before it could serve /api/version"
              exit 1
            }

            $served = $null
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/version" -TimeoutSec 5
                $served = $resp.version
                Write-Host "Server responded; version=$served"
                break
              } catch {
                Write-Host "Waiting for server to come up... ($($_.Exception.Message))"
                Start-Sleep -Seconds 3
              }
            }
            if ($null -eq $served) {
              Dump-Diagnostics
              Write-Host "::error::EXE never served /api/version within 90s"
              exit 1
            }
            if ($served.Trim() -ne $expected) {
              Dump-Diagnostics
              Write-Host "::error::Version mismatch: served '$served' != VERSION '$expected'"
              exit 1
            }
            Write-Host "Smoke-test passed: EXE serves version $served"
          } finally {
            # $proc is the cmd.exe wrapper; the EXE is its child. Kill the whole
            # tree (/T) so Domestique.exe doesn't outlive the wrapper.
            if ($proc -and -not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F 2>$null
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package EXE as zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Domestique\* -DestinationPath Domestique-Windows.zip

      - name: Upload EXE artifact (build-only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Domestique-Windows-EXE
          path: Domestique-Windows.zip
          retention-days: 7

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Domestique-Windows.zip
          fail_on_unmatched_files: true
